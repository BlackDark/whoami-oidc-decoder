[tools]
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.2"
zizmor = "1.32.0"

[tasks.build]
description = "Build the binary"
run = "go build -o bin/whoami-oidc-decoder ./cmd/whoami-oidc-decoder"

[tasks.test]
description = "Run tests"
run = "go test ./... -race -cover"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.check]
description = "Format, vet, build, lint, and test"
depends = ["build", "test", "lint"]
run = ["test -z \"$(gofmt -l .)\"", "go vet ./..."]

[tasks.snapshot]
description = "Verify the GoReleaser configuration without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.zizmor]
description = "Run zizmor against GitHub Actions workflows"
run = "zizmor .github/workflows"
